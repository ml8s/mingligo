# MingliGo MCP local/development stack.
#
# This file is only for building and running the example MCP image from this
# source tree.

services:
  mingligo-mcp:
    image: mingligo-mcp:local
    build:
      context: ../../..
      dockerfile: examples/mingligo-mcp/deploy/Dockerfile
    entrypoint: ["/usr/local/bin/mingligo-mcp", "--addr", ":8081"]
    ports:
      - "${MINGLIGO_MCP_HOST_PORT:-8083}:8081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"
