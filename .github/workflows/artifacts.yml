name: MingliGo artifacts

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "OCI registry prefix"
        required: true
        default: "ghcr.io/ml8s"

permissions:
  contents: read
  packages: write

concurrency:
  group: mingligo-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Source gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make gate

  image:
    name: Build, smoke, publish, and manifest API image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Normalize registry namespace
        env:
          REGISTRY: ${{ inputs.registry || 'ghcr.io/ml8s' }}
        run: |
          set -euo pipefail
          lowered="${REGISTRY,,}"
          if [[ "$lowered" == ghcr.io/* ]]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            lowered="ghcr.io/$owner"
          fi
          printf 'IMAGE_PREFIX=%s\n' "$lowered" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: startsWith(env.REGISTRY, 'ghcr.io')
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build API image
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || '1970-01-01T00:00:00Z' }}
          REGISTRY_PREFIX: ${{ inputs.registry || 'ghcr.io/ml8s' }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          lowered="${REGISTRY_PREFIX,,}"
          if [[ "$lowered" == ghcr.io/* ]]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            lowered="ghcr.io/$owner"
          fi
          MINGLIGO_API_IMAGE="$lowered/mingligo-api:sha-$short"
          printf 'MINGLIGO_API_IMAGE=%s\n' "$MINGLIGO_API_IMAGE" >> "$GITHUB_ENV"
          docker build \
            --build-arg GIT_SHA="$short" \
            --build-arg COMMIT="$GIT_COMMIT" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -f examples/mingligo-api/deploy/Dockerfile \
            -t "$MINGLIGO_API_IMAGE" .

      - name: Smoke API image
        run: MINGLIGO_API_IMAGE="$MINGLIGO_API_IMAGE" examples/mingligo-api/deploy/smoke-api.sh

      - name: Push API image
        run: docker push "$MINGLIGO_API_IMAGE"

      - name: Capture approved artifact manifest
        run: |
          set -euo pipefail
          api_repo="${MINGLIGO_API_IMAGE%:*}"
          api_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$MINGLIGO_API_IMAGE" \
            | while IFS= read -r ref; do [[ "$ref" == "$api_repo@"* ]] && { printf '%s\n' "$ref"; exit 0; }; done)"
          [[ -n "$api_digest" ]]
          python scripts/release/generate_artifact_manifest.py \
            --repo "$GITHUB_WORKSPACE" \
            --api-image "$api_digest" \
            > mingligo-artifact.json
          cat mingligo-artifact.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mingligo-artifact-${{ github.sha }}
          path: mingligo-artifact.json
          if-no-files-found: error
          retention-days: 30
