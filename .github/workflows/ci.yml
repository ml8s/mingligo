name: CI

on:
  push:
  pull_request:

jobs:
  fact-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: test -z "$(go fmt ./...)"
      - run: make boundary
      - run: make image-mcp IMAGE_REGISTRY=mingligo-review IMAGE_TAG=ci
      - run: IMAGE_REGISTRY=mingligo-review IMAGE_TAG=ci make smoke-mcp
